# 完整配置示例。程序不会自动读取本文件——默认在当前目录找 config.yaml，找不到就用内置默认值
# （只监听 127.0.0.1、免鉴权）。所以在仓库根目录直接运行二进制也只有本机能访问。
#
# 需要时复制一份再改（config.yaml 已在 .gitignore 里，不会被提交）：
#   cp config.example.yaml config.yaml
#   二进制：在 config.yaml 所在目录运行，或 -config /path/to/config.yaml
#   Docker：docker-compose.yml 里取消 volumes 注释，挂到 /app/config.yaml
#
# 所有字段都能被环境变量覆盖（见文末），所以通常只需要 DEVIN_TOKEN。
server:
  # 默认只走回环。改成 ":18089" 或 "0.0.0.0:18089" 会对局域网开放——先设置 auth.api_key。
  # 挂进容器时这里的值会被镜像的 SERVER_LISTEN=:18089 覆盖（容器端口映射需要），
  # 宿主机侧仍由 compose 的 127.0.0.1:<PORT> 限定只走回环。
  listen: "127.0.0.1:18089"
  # 同时处理的 /v1/* 请求上限；0 或省略 = 1024
  max_concurrency: 1024

catalog:
  # 目录快照；留空不写。容器里建议留空，避免挂载目录不可写
  snapshot: ""
  # 目录刷新间隔
  refresh: "5m"
  # raw = 上游原始 id；openai = 基础模型；both = 两者都列
  model_mode: "openai"
  # 从 family metadata 生成基础模型与档位建议
  auto_tiers: true

debug:
  # 开启后每个请求把完整提示词写到 logs/<时间>/（注意隐私）
  enabled: false

devin:
  base_url: "https://server.codeium.com"
  # 留空，由 DEVIN_TOKEN 环境变量覆盖
  token: ""
  # 启动必填；供 -check 使用。不是兜底模型：请求仍须带 model。可用 DEVIN_MODEL 覆盖
  model: "glm-5-2"
  # 代理地址（可选），支持 http:// 与 https://
  proxy: ""
  # 强制 HTTP/1.1：避免 HTTP/2 多 stream 复用被上游串行处理
  force_http1: true
  # 上游两帧之间的最长等待；超时返回 504，0 表示不限制
  stream_idle_timeout: "5m"
  # 推理档位映射：model + reasoning_effort → 实际上游 uid（未配置则原样透传）
  # reasoning_tiers:
  #   swe-2:
  #     medium: swe-2-medium
  #     high: swe-2-high

auth:
  # 留空 = 不校验；对外暴露时请用 AUTH_API_KEY 覆盖，或在这里写强随机串
  api_key: ""

# 环境变量优先于本文件：
#   SERVER_LISTEN, SERVER_MAX_CONCURRENCY
#   DEVIN_BASE_URL, DEVIN_TOKEN, DEVIN_MODEL, DEVIN_PROXY,
#   DEVIN_FORCE_HTTP1, DEVIN_STREAM_IDLE_TIMEOUT
#   DEBUG_ENABLED, AUTH_API_KEY
#   CATALOG_SNAPSHOT, CATALOG_REFRESH, CATALOG_MODEL_MODE, CATALOG_AUTO_TIERS
