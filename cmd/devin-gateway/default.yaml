# 内置默认配置：仅当 --config 指向的文件不存在时使用。
#
# 设计目标：镜像与发布二进制无需附带 config.yaml 即可启动，
# 用户只需提供 DEVIN_TOKEN（以及可选的 DEVIN_MODEL、AUTH_API_KEY 等环境变量）。
#
# 所有字段都能被环境变量覆盖，见 docs/configuration.zh-CN.md。
server:
  # 默认只监听回环，直接跑二进制时局域网访问不到（鉴权默认为空）。
  # 要对外开放：SERVER_LISTEN=0.0.0.0:18089，并同时设置 AUTH_API_KEY。
  # 镜像里由 Dockerfile 的 ENV SERVER_LISTEN=:18089 覆盖（容器端口映射需要），
  # 宿主机侧仍由 compose 的 127.0.0.1:<PORT> 限定只走回环。
  listen: "127.0.0.1:18089"

catalog:
  # 内置默认不写快照：容器里挂载目录可能不可写
  snapshot: ""
  refresh: "5m"
  model_mode: "openai"
  auto_tiers: true

debug:
  enabled: false

devin:
  base_url: "https://server.codeium.com"
  # 真正的 token 由 DEVIN_TOKEN 环境变量注入
  token: ""
  # 上游请求必须带一个模型 uid；可用 DEVIN_MODEL 覆盖
  model: "glm-5-2"
  proxy: ""
  force_http1: true
  stream_idle_timeout: "5m"

auth:
  api_key: ""
