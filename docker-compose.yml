# 默认：直接拉预构建镜像（多架构，linux/amd64 + linux/arm64）。
# 本地开发请用 docker-compose.dev.yml（make up 会自动叠加）。
services:
  gateway:
    image: ${GATEWAY_IMAGE:-ghcr.io/xiaohai-78/devin-gateway:latest}
    restart: unless-stopped
    ports:
      # 只绑回环。局域网访问改成 "18089:18089"，并设置 AUTH_API_KEY
      - "127.0.0.1:${PORT:-18089}:18089"
    environment:
      # 凭据只在运行时注入，不落盘到仓库
      DEVIN_TOKEN: ${DEVIN_TOKEN:?请先运行 make token，或在 .env 里设置 DEVIN_TOKEN}
      AUTH_API_KEY: ${AUTH_API_KEY:-}
    # 镜像内置默认配置，通常不需要挂载。
    # 要覆盖配置时取消注释（文件必须存在，否则 Docker 会建一个同名目录）：
    # volumes:
    #   - ./config.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:18089/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
